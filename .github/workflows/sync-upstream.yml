name: Sync Upstream English Dictionaries

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild and release even if upstream digests are unchanged'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check upstream sources and build dictionaries
        id: build
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force_rebuild }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python3 scripts/build_english_dict.py --check-and-update $FORCE_FLAG

      - name: Verify compiled outputs
        if: steps.build.outputs.UPDATED == 'true'
        run: python3 scripts/verify_dict.py

      - name: Commit updated artifacts and tag release
        if: steps.build.outputs.UPDATED == 'true'
        id: commit
        run: |
          VERSION="${{ steps.build.outputs.VERSION }}"
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG="v${VERSION}-$(date -u +%H%M%S)"
          fi
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ upstream-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(dict): sync upstream English dictionaries (${TAG})"
          fi
          git tag "$TAG"
          git push origin main --follow-tags

      - name: Publish GitHub Release
        if: steps.build.outputs.UPDATED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.commit.outputs.TAG }}
          name: Hare English Dictionary ${{ steps.commit.outputs.TAG }}
          generate_release_notes: true
          files: |
            dist/hare-english-rime.zip
            dist/EnglishLexicon.txt
            dist/EnglishFollowers.txt
